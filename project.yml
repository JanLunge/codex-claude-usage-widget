name: UsageWidget
options:
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: '14.0'
targets:
  UsageWidget:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
      - path: Scripts/usage.py
        buildPhase: resources
    dependencies:
      - target: UsageWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.janlunge.usagewidget
        PRODUCT_NAME: Usage Widget
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/UsageWidget.entitlements
    entitlements:
      path: App/UsageWidget.entitlements
      properties: {}
  UsageWidgetExtension:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.janlunge.usagewidget.widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/UsageWidget.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) WIDGET_EXTENSION'
    entitlements:
      path: Widget/UsageWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
schemes:
  UsageWidget:
    build:
      targets:
        UsageWidget: all
